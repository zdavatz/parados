<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Archivo:wght@400;500;600;700&display=swap');
    body { margin: 0; }
    a { color: #ffd700; } a:hover { color: #fff; }
    .pill { display:inline-flex; align-items:center; gap:8px; font-family:'Archivo',system-ui,sans-serif; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.6px; padding:11px 16px; border:2px solid #000; cursor:pointer; box-shadow:3px 3px 0 #000; }
  </style>
</helmet>

<div style="width:880px; box-sizing:border-box; background:#12100e; font-family:'Archivo',system-ui,sans-serif; color:#f2ede3; padding:0 0 36px;">

  <!-- top brand bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 32px; border-bottom:3px solid #ffd700;">
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; background:#ffd700; color:#12100e; font-family:'Syne',sans-serif; font-weight:800; font-size:26px; border:2px solid #000; box-shadow:3px 3px 0 #000;">D</span>
      <span style="font-family:'Syne',sans-serif; font-weight:800; font-size:22px; letter-spacing:0.5px;">PARADOS <span style="color:#ffd700;">ABSTRACT GAMES</span></span>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="pill" style="background:#f2ede3; color:#12100e;">How to play</button>
      <button class="pill" style="background:#25D366; color:#0b3d1e;">Share</button>
      <button class="pill" style="background:#ffd700; color:#12100e; padding:11px 12px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12100e" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    </div>
  </div>

  <!-- game title + status -->
  <div style="padding:30px 32px 20px;">
    <div style="font-family:'Syne',sans-serif; font-weight:800; font-size:46px; line-height:0.98; text-transform:uppercase; letter-spacing:-0.5px;">Divided<br>Loyalties</div>
    <div style="margin-top:12px; display:inline-block; background:#ffd700; color:#12100e; font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:0.8px; padding:5px 11px; border:2px solid #000;">2 players &middot; 40&ndash;80 min &middot; connect 3 or 4</div>
    <div style="display:flex; gap:14px; margin-top:22px; flex-wrap:wrap;">
      <div style="flex:1 1 0; min-width:180px; background:#1c1915; border:2px solid #000; box-shadow:4px 4px 0 #000; padding:14px 16px;">
        <div style="font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#a89a7c;">Turn</div>
        <div style="display:flex; align-items:center; gap:9px; margin-top:8px;"><span style="width:15px;height:15px;background:#1e88e5; border:2px solid #000;"></span><span style="font-weight:700; font-size:16px;">BLUE &mdash; SATZ 2/4</span></div>
      </div>
      <div style="flex:1 1 0; min-width:180px; background:#1c1915; border:2px solid #000; box-shadow:4px 4px 0 #000; padding:14px 16px;">
        <div style="font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:#a89a7c;">Score</div>
        <div style="display:flex; gap:18px; margin-top:8px; font-weight:700; font-size:16px;"><span style="color:#5aa9f0;">BLUE 3</span><span style="color:#FFD54F;">YELLOW 2</span></div>
      </div>
    </div>
  </div>

  <!-- board frame -->
  <div style="margin:6px 32px 0; background:#000; border:2px solid #000; box-shadow:5px 5px 0 #ffd700; padding:16px;">
    <div style="display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:6px;">
      <div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a;"></div><div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a; display:flex; align-items:center; justify-content:center;"><span style="width:74%;height:74%;border-radius:50%;background:#1e88e5;"></span></div><div style="aspect-ratio:1; background:#9a9a9a;"></div><div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div>
      <div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a; display:flex; align-items:center; justify-content:center;"><span style="width:74%;height:74%;border-radius:50%;background:#FFD54F;"></span></div><div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a;"></div><div style="aspect-ratio:1; background:#3a3a3a; display:flex; align-items:center; justify-content:center;"><span style="width:74%;height:74%;border-radius:50%;background:#1e88e5;"></span></div><div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a;"></div>
      <div style="aspect-ratio:1; background:#9a9a9a;"></div><div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a; display:flex; align-items:center; justify-content:center;"><span style="width:74%;height:74%;border-radius:50%;background:#e53935;"></span></div><div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a;"></div><div style="aspect-ratio:1; background:#3a3a3a;"></div>
      <div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a;"></div><div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div><div style="aspect-ratio:1; background:#9a9a9a;"></div><div style="aspect-ratio:1; background:#3a3a3a;"></div><div style="aspect-ratio:1; background:#6a6a6a;"></div>
    </div>
  </div>

  <!-- action row -->
  <div style="display:flex; gap:12px; padding:22px 32px 0; flex-wrap:wrap;">
    <button class="pill" style="background:#ffd700; color:#12100e;">Undo move</button>
    <button class="pill" style="background:#f2ede3; color:#12100e;">Restart</button>
    <button class="pill" style="background:#f2ede3; color:#12100e;">Save as CSV</button>
  </div>

</div>
</x-dc>
</body>
</html>
