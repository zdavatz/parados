<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #b8860b; } a:hover { color: #92680a; }
    .pill { display:inline-flex; align-items:center; gap:7px; border-radius:999px; font-family:'Public Sans',system-ui,sans-serif; font-weight:600; font-size:14px; padding:9px 15px; border:0; cursor:pointer; }
  </style>
</helmet>

<div style="width:880px; box-sizing:border-box; background:#eceff1; font-family:'Public Sans',system-ui,sans-serif; color:#1b2327; padding:0 0 34px;">

  <!-- top brand bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 34px; border-bottom:1px solid rgba(0,0,0,0.08);">
    <div style="display:flex; align-items:baseline; gap:12px;">
      <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.5px; color:#1b2327;">Para<span style="color:#b8860b;">D</span>os</span>
      <span style="font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#546e7a;">Abstract Games</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="pill" style="background:#e7ecef; color:#1b2327;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8860b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>
        How to play
      </button>
      <button class="pill" style="background:#25D366; color:#0b3d1e;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#0b3d1e"><path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.2-1.4A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2a1 1 0 0 1 .7-.3h.5c.2 0 .4 0 .6.5l.7 1.7c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.5.1.3.6 1 1.3 1.6.9.8 1.6 1 1.9 1.2.2.1.4.1.5-.1l.6-.7c.2-.2.3-.2.5-.1l1.6.8c.2.1.4.2.4.3.1.1.1.6-.1 1Z"/></svg>
        Share
      </button>
      <button class="pill" style="background:#e7ecef; color:#b8860b; padding:9px 12px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#b8860b" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </div>

  <!-- game title + status -->
  <div style="padding:30px 34px 20px;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; line-height:1.05; color:#1b2327;">Divided Loyalties</div>
    <div style="margin-top:6px; color:#546e7a; font-size:15px;">2 players &middot; 40&ndash;80 min &middot; connect 3 or 4</div>
    <div style="display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;">
      <div style="flex:1 1 0; min-width:180px; background:#ffffff; border:1px solid rgba(0,0,0,0.08); border-radius:12px; padding:14px 16px;">
        <div style="font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#546e7a;">Turn</div>
        <div style="display:flex; align-items:center; gap:9px; margin-top:7px;"><span style="width:14px;height:14px;border-radius:50%;background:#1e88e5;"></span><span style="font-weight:600; font-size:16px;">Blue &mdash; Satz 2 / 4</span></div>
      </div>
      <div style="flex:1 1 0; min-width:180px; background:#ffffff; border:1px solid rgba(0,0,0,0.08); border-radius:12px; padding:14px 16px;">
        <div style="font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#546e7a;">Score</div>
        <div style="display:flex; gap:18px; margin-top:7px; font-weight:600; font-size:16px;"><span style="color:#1565c0;">Blue 3</span><span style="color:#a1791f;">Yellow 2</span></div>
      </div>
    </div>
  </div>

  <!-- board frame (game-state colours stay fixed in both themes) -->
  <div style="margin:6px 34px 0; background:#ffffff; border:1px solid rgba(0,0,0,0.10); border-radius:16px; padding:22px;">
    <div style="display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:8px;">
      <div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#1e88e5;"></span></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div>
      <div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#FFF59D;"></span></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#1e88e5;"></span></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div>
      <div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#e53935;"></span></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div>
      <div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#9a9a9a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#3a3a3a;"></div><div style="aspect-ratio:1; border-radius:8px; background:#6a6a6a;"></div>
    </div>
  </div>

  <!-- action row -->
  <div style="display:flex; gap:10px; padding:20px 34px 0; flex-wrap:wrap;">
    <button class="pill" style="background:#b8860b; color:#ffffff; font-weight:700;">Undo move</button>
    <button class="pill" style="background:#e7ecef; color:#1b2327;">Restart</button>
    <button class="pill" style="background:#e7ecef; color:#1b2327;">Save as CSV</button>
  </div>

</div>
</x-dc>
</body>
</html>
