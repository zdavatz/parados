<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #ffd700; } a:hover { color: #ffe969; }
    .pill { display:inline-flex; align-items:center; gap:7px; border-radius:999px; font-family:'Public Sans',system-ui,sans-serif; font-weight:600; font-size:14px; padding:9px 15px; border:0; cursor:pointer; }
    .mc { aspect-ratio:1; border-radius:7px; background:#2f3d45; display:flex; align-items:center; justify-content:center; }
    .disc { width:76%; height:76%; border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:15px; }
    .coll { width:80%; height:80%; border-radius:9px; border:3px solid #ffd700; }
  </style>
</helmet>

<div style="width:880px; box-sizing:border-box; background:#263238; font-family:'Public Sans',system-ui,sans-serif; color:#eceff1; padding:0 0 34px;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 34px; border-bottom:1px solid rgba(255,255,255,0.08);">
    <div style="display:flex; align-items:baseline; gap:12px;">
      <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:22px; letter-spacing:0.5px;">Para<span style="color:#ffd700;">D</span>os</span>
      <span style="font-size:12px; letter-spacing:2px; text-transform:uppercase; color:#90a4ae;">Abstract Games</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="pill" style="background:rgba(255,255,255,0.06); color:#eceff1;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>How to play</button>
      <button class="pill" style="background:#25D366; color:#0b3d1e;"><svg width="16" height="16" viewBox="0 0 24 24" fill="#0b3d1e"><path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.2-1.4A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2a1 1 0 0 1 .7-.3h.5c.2 0 .4 0 .6.5l.7 1.7c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.5.1.3.6 1 1.3 1.6.9.8 1.6 1 1.9 1.2.2.1.4.1.5-.1l.6-.7c.2-.2.3-.2.5-.1l1.6.8c.2.1.4.2.4.3.1.1.1.6-.1 1Z"/></svg>Share</button>
      <button class="pill" style="background:rgba(255,255,255,0.06); color:#ffd700; padding:9px 12px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    </div>
  </div>

  <div style="padding:30px 34px 20px;">
    <div style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:34px; line-height:1.05;">MAKA LAINA</div>
    <div style="margin-top:6px; color:#90a4ae; font-size:15px;">2 players &middot; 20&ndash;40 min &middot; collect the colours</div>
    <div style="display:flex; gap:12px; margin-top:20px; flex-wrap:wrap;">
      <div style="flex:1 1 0; min-width:180px; background:#37474f; border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:14px 16px;">
        <div style="font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#90a4ae;">Turn</div>
        <div style="display:flex; align-items:center; gap:9px; margin-top:7px;"><span style="width:14px;height:14px;border-radius:4px;background:#111; border:2px solid #ffd700;"></span><span style="font-weight:600; font-size:16px;">Black collects</span></div>
      </div>
      <div style="flex:1 1 0; min-width:180px; background:#37474f; border:1px solid rgba(255,255,255,0.06); border-radius:12px; padding:14px 16px;">
        <div style="font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:#90a4ae;">Colours won</div>
        <div style="display:flex; gap:18px; margin-top:7px; font-weight:600; font-size:16px;"><span>Black 2</span><span style="color:#cfd8dc;">White 1</span></div>
      </div>
    </div>
  </div>

  <div style="margin:6px 34px 0; background:#1c262b; border:1px solid rgba(255,255,255,0.07); border-radius:16px; padding:22px;">
    <div style="display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:8px;">
      <div class="mc"><span class="disc" style="background:#e74c3c;">3</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#3498db;">1</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#27ae60;"></span></div><div class="mc"></div><div class="mc"><span class="coll" style="background:#111;"></span></div><div class="mc"></div>
      <div class="mc"></div><div class="mc"><span class="disc" style="background:#d4ac0d;">5</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#9b59b6;"></span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#e67e22;"></span></div><div class="mc"></div><div class="mc"></div>
      <div class="mc"><span class="disc" style="background:#3498db;">4</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#e74c3c;">2</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#d4ac0d;">6</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#27ae60;"></span></div><div class="mc"></div>
      <div class="mc"></div><div class="mc"><span class="coll" style="background:#f4f7f9;"></span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#e67e22;"></span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#3498db;">6</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#9b59b6;"></span></div>
      <div class="mc"></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#d4ac0d;">1</span></div><div class="mc"></div><div class="mc"><span class="disc" style="background:#e74c3c;">4</span></div><div class="mc"></div><div class="mc"></div><div class="mc"></div>
    </div>
  </div>

  <div style="display:flex; gap:10px; padding:20px 34px 0; flex-wrap:wrap;">
    <button class="pill" style="background:#ffd700; color:#263238; font-weight:700;">Undo move</button>
    <button class="pill" style="background:rgba(255,255,255,0.06); color:#eceff1;">Resume last game</button>
    <button class="pill" style="background:rgba(255,255,255,0.06); color:#eceff1;">Export opening</button>
  </div>

</div>
</x-dc>
</body>
</html>
