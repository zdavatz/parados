<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Spectral:wght@400;500;600&display=swap');
    body { margin: 0; }
    a { color: #9a3412; } a:hover { color: #7c2d12; }
    .pill { display:inline-flex; align-items:center; gap:7px; border-radius:6px; font-family:'Spectral',Georgia,serif; font-weight:600; font-size:14px; padding:9px 16px; border:1px solid #ddd2bf; background:transparent; color:#3a352c; cursor:pointer; }
  </style>
</helmet>

<div style="width:880px; box-sizing:border-box; background:#f4efe4; font-family:'Spectral',Georgia,serif; color:#2c2820; padding:0 0 34px;">

  <!-- top brand bar -->
  <div style="display:flex; align-items:center; justify-content:space-between; padding:22px 36px; border-bottom:1px solid #ddd2bf;">
    <div style="display:flex; align-items:baseline; gap:12px;">
      <span style="font-family:'DM Serif Display',serif; font-size:26px; letter-spacing:0.3px; color:#23201b;">Para<span style="color:#9a3412; font-style:italic;">D</span>os</span>
      <span style="font-size:11px; letter-spacing:3px; text-transform:uppercase; color:#8a8172;">Abstract Games</span>
    </div>
    <div style="display:flex; gap:10px; align-items:center;">
      <button class="pill"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12" y2="17"/></svg>How to play</button>
      <button class="pill" style="background:#25D366; color:#0b3d1e; border-color:#1faa53;"><svg width="15" height="15" viewBox="0 0 24 24" fill="#0b3d1e"><path d="M12 2a10 10 0 0 0-8.6 15l-1.4 5 5.2-1.4A10 10 0 1 0 12 2Zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-1.7-.1-.4-.1-.9-.3-1.6-.6-2.8-1.2-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8 0-1.3.7-2 .9-2.2a1 1 0 0 1 .7-.3h.5c.2 0 .4 0 .6.5l.7 1.7c.1.1.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.5.1.3.6 1 1.3 1.6.9.8 1.6 1 1.9 1.2.2.1.4.1.5-.1l.6-.7c.2-.2.3-.2.5-.1l1.6.8c.2.1.4.2.4.3.1.1.1.6-.1 1Z"/></svg>Share</button>
      <button class="pill" style="padding:9px 11px;"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9a3412" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg></button>
    </div>
  </div>

  <!-- game title + status -->
  <div style="padding:34px 36px 20px;">
    <div style="font-family:'DM Serif Display',serif; font-size:42px; line-height:1.02; color:#23201b;">Divided Loyalties</div>
    <div style="margin-top:8px; color:#8a8172; font-size:15px; font-style:italic;">Two players &middot; 40&ndash;80 min &middot; connect 3 or 4</div>
    <div style="display:flex; gap:14px; margin-top:22px; flex-wrap:wrap;">
      <div style="flex:1 1 0; min-width:180px; background:#fbf8f0; border:1px solid #e4dccb; border-radius:8px; padding:15px 18px;">
        <div style="font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#a89e8b;">Turn</div>
        <div style="display:flex; align-items:center; gap:9px; margin-top:8px;"><span style="width:14px;height:14px;border-radius:50%;background:#1e88e5;"></span><span style="font-weight:600; font-size:16px;">Blue &mdash; Set 2 / 4</span></div>
      </div>
      <div style="flex:1 1 0; min-width:180px; background:#fbf8f0; border:1px solid #e4dccb; border-radius:8px; padding:15px 18px;">
        <div style="font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#a89e8b;">Score</div>
        <div style="display:flex; gap:20px; margin-top:8px; font-weight:600; font-size:16px;"><span style="color:#1e6fbf;">Blue 3</span><span style="color:#b7952b;">Yellow 2</span></div>
      </div>
    </div>
  </div>

  <!-- board frame -->
  <div style="margin:6px 36px 0; background:#efe8d8; border:1px solid #ddd2bf; border-radius:12px; padding:24px;">
    <div style="display:grid; grid-template-columns:repeat(8, minmax(0,1fr)); gap:8px;">
      <div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#1e88e5;"></span></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div>
      <div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#FFD54F;"></span></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#1e88e5;"></span></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div>
      <div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9; display:flex; align-items:center; justify-content:center;"><span style="width:70%;height:70%;border-radius:50%;background:#c62828;"></span></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div>
      <div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div><div style="aspect-ratio:1; border-radius:5px; background:#e6ddc9;"></div><div style="aspect-ratio:1; border-radius:5px; background:#c9bfa8;"></div><div style="aspect-ratio:1; border-radius:5px; background:#d8cfba;"></div>
    </div>
  </div>

  <!-- action row -->
  <div style="display:flex; gap:10px; padding:22px 36px 0; flex-wrap:wrap;">
    <button class="pill" style="background:#9a3412; color:#fbf8f0; border-color:#7c2d12;">Undo move</button>
    <button class="pill">Restart</button>
    <button class="pill">Save as CSV</button>
  </div>

</div>
</x-dc>
</body>
</html>
